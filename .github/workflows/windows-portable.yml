name: Build Windows portable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage official Tor Expert Bundle
        run: python tools/fetch_tor_runtime.py

      - name: Stage Windows VPN runtime
        run: python tools/fetch_vpn_runtime.py

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable directory
        run: pyinstaller --noconfirm --clean --name Onionbread --windowed --onedir --add-data "runtime;runtime" onionbread.py

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Onionbread/*" -DestinationPath "Onionbread-Windows-x64.zip"

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Onionbread-Windows-x64
          path: Onionbread-Windows-x64.zip
          if-no-files-found: error
